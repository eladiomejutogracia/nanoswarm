<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NanoSwarm · deck</title>
    <meta name="description" content="NanoSwarm in eight slides, in English or Spanish. Every background is a live <nano-swarm>." />
    <link rel="canonical" href="https://eladiomejutogracia.github.io/nanoswarm/deck/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NanoSwarm" />
    <meta property="og:url" content="https://eladiomejutogracia.github.io/nanoswarm/deck/" />
    <meta property="og:title" content="NanoSwarm in eight slides" />
    <meta property="og:description" content="Every background is a live &lt;nano-swarm&gt;: formulas, an attractor, an equalizer you can play, a running fox." />
    <meta property="og:image" content="https://eladiomejutogracia.github.io/nanoswarm/preview.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='9' cy='9' r='2.5'/%3E%3Ccircle cx='16' cy='9' r='2.5'/%3E%3Ccircle cx='23' cy='9' r='2.5'/%3E%3Ccircle cx='9' cy='16' r='2.5'/%3E%3Ccircle cx='23' cy='16' r='2.5'/%3E%3Ccircle cx='9' cy='23' r='2.5'/%3E%3Ccircle cx='16' cy='23' r='2.5'/%3E%3Ccircle cx='23' cy='23' r='2.5'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23D71921'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@500..800&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" />
    <link rel="stylesheet" href="./deck.css" />
</head>
<body>
    <!-- The deck renders this one element; every slide rewrites its formula and attributes. -->
    <nano-swarm id="swarm" aria-hidden="true"></nano-swarm>
    <div class="grain" aria-hidden="true"></div>
    <div class="progress" id="progress"></div>

    <main class="deck" id="deck" aria-live="polite"></main>

    <nav class="bar" aria-label="Slides">
        <button id="prev">←</button>
        <span class="count" id="count">1 / 8</span>
        <button id="next">→</button>
        <span class="spacer"></span>
        <button id="b-sound" aria-pressed="false">♪ <span class="wide-only">M</span></button>
        <button id="b-notes" aria-expanded="false" aria-controls="notes">Notes <span class="wide-only">N</span></button>
        <button id="b-index" aria-controls="index">Index <span class="wide-only">G</span></button>
        <button id="b-lang">ES</button>
        <button id="b-help">?</button>
    </nav>

    <aside class="panel notes" id="notes" hidden>
        <h3 id="notes-title">Speaker notes</h3>
        <p id="notes-text"></p>
    </aside>

    <div class="panel overlay" id="index" hidden role="dialog" aria-labelledby="b-index">
        <button class="close" id="close-index">Close (Esc)</button>
        <div class="index-grid" id="index-grid"></div>
    </div>

    <div class="panel help" id="help" hidden role="dialog" aria-labelledby="help-title">
        <h3 id="help-title">Keyboard shortcuts</h3>
        <dl id="help-list"></dl>
    </div>

    <script type="module" src="./deck.ts"></script>
</body>
</html>
