# Every push and pull request: types, tests, and both builds must pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:web
      - name: The AI skill's files are up to date (run `npm run build:check` and `npx vitest -u`)
        run: git diff --exit-code -- .claude/skills web/public/llms.txt
      - name: Every example passes the checker
        run: npm run check -- examples
