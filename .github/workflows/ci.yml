# Every push and pull request: types, tests, and both builds must pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same pull request cancels the run that is now outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:web
      - name: The AI skill's files are up to date (run `npm run build:check` and `npx vitest -u`)
        run: git diff --exit-code -- .claude/skills web/public/llms.txt
      - name: Every example — and the page the header image shows — passes the checker
        run: npm run check -- examples web/public/preview.html

  # Pull requests only: stops new dependencies that have known vulnerabilities.
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
