# Publishes the playground to GitHub Pages on every push to main, together
# with the drop-in script (nano-swarm.js) so <nano-swarm> works without npm.
#
# GitHub Pages is free for public repositories. While the repository is
# private this workflow is skipped (no failures); once it is public, enable
# Pages once: Settings → Pages → Source: "GitHub Actions".
name: Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:web
      - run: cp dist/nano-swarm.js dist-web/nano-swarm.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
      - id: deployment
        uses: actions/deploy-pages@v5
