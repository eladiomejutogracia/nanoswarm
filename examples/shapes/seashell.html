<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seashell</title>
  <script src="https://eladiomejutogracia.github.io/nanoswarm/nano-swarm.js"></script>
  <style>body { margin: 0; background: #03040a } nano-swarm { height: 100vh }</style>
</head>
<body>
<nano-swarm title="Seashell" colors="#3e2723 #d7ccc8 #fff3e0" solid>
  U = 3 * u
  g = exp(U / (6*PI))
  k = cos(v/2)^2
  x = 2 * (1 - g) * cos(U) * k
  z = 2 * (g - 1) * sin(U) * k
  y = (1 - g*g - sin(v) + g*sin(v)) * 0.9 + 2.5
</nano-swarm>
</body>
</html>
