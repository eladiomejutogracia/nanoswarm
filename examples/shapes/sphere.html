<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sphere</title>
  <script src="https://eladiomejutogracia.github.io/nanoswarm/nano-swarm.js"></script>
  <style>body { margin: 0; background: #03040a } nano-swarm { height: 100vh }</style>
</head>
<body>
<nano-swarm title="Sphere">
  # Evenly spread sphere (Archimedes' trick)
  y = 4 * (v / PI - 1)
  R = sqrt(16 - y*y)
  x = R * cos(u)
  z = R * sin(u)
</nano-swarm>
</body>
</html>
