<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trefoil knot</title>
  <script src="https://eladiomejutogracia.github.io/nanoswarm/nano-swarm.js"></script>
  <style>body { margin: 0; background: #000000 } nano-swarm { height: 100vh }</style>
</head>
<body>
<nano-swarm title="Trefoil knot" colors="#9e9e9e #ffffff #cfd8dc" background="#000000">
  cx = sin(u) + 2*sin(2*u)
  cy = cos(u) - 2*cos(2*u)
  cz = -sin(3*u)
  x = 1.3*cx + 0.35*cos(v)
  y = 1.3*cy + 0.35*sin(v)
  z = 1.3*cz + 0.35*cos(v + u)
  # one color per strand position
  c = u / TAU
</nano-swarm>
</body>
</html>
