<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thomas</title>
  <script src="https://eladiomejutogracia.github.io/nanoswarm/nano-swarm.js"></script>
  <style>body { margin: 0; background: #010608 } nano-swarm { height: 100vh }</style>
</head>
<body>
<nano-swarm title="Thomas" colors="#00ff87 #60efff #0061ff" background="#010608">
  b = 0.208186
  # with music, the hi-hats push the particles: they rush and flash
  go = 1 + 1.5 * treble
  dx = go * (sin(y) - b * x)
  dy = go * (sin(z) - b * y)
  dz = go * (sin(x) - b * z)
  c = sqrt(dx*dx + dy*dy + dz*dz) / 1.6
</nano-swarm>
</body>
</html>
