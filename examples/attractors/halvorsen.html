<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halvorsen</title>
  <script src="https://eladiomejutogracia.github.io/nanoswarm/nano-swarm.js"></script>
  <style>body { margin: 0; background: #03040a } nano-swarm { height: 100vh }</style>
</head>
<body>
<nano-swarm title="Halvorsen" colors="#7c4dff #00e5ff #ffffff">
  a = 1.89
  dx = -a*x - 4*y - 4*z - y*y
  dy = -a*y - 4*z - 4*x - z*z
  dz = -a*z - 4*x - 4*y - x*x
  c = sqrt(dx*dx + dy*dy + dz*dz) / 40
</nano-swarm>
</body>
</html>
