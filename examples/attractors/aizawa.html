<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aizawa</title>
  <script src="https://eladiomejutogracia.github.io/nanoswarm/nano-swarm.js"></script>
  <style>body { margin: 0; background: #070201 } nano-swarm { height: 100vh }</style>
</head>
<body>
<nano-swarm title="Aizawa" colors="#ff3d00 #ff9100 #ffe57f" background="#070201">
  # Aizawa, with y as the up axis
  dx = (y - 0.7) * x - 3.5 * z
  dz = 3.5 * x + (y - 0.7) * z
  dy = 0.6 + 0.95 * y - y^3 / 3 - (x*x + z*z) * (1 + 0.25 * y) + 0.1 * y * x^3
  c = (sqrt(dx*dx + dy*dy + dz*dz) - 1) / 4.5
</nano-swarm>
</body>
</html>
