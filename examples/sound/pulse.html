<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse</title>
  <script src="https://eladiomejutogracia.github.io/nanoswarm/nano-swarm.js"></script>
  <style>body { margin: 0; background: #03040a } nano-swarm { height: 100vh }</style>
</head>
<body>
<nano-swarm title="Pulse">
  # A sphere that breathes with the music
  h = v / PI - 1
  ring = sqrt(1 - h*h)
  R = 3.5 + bass * 1.5 + 0.25 * sin(8*u + 3*t) * (0.3 + treble * 2)
  x = R * ring * cos(u)
  y = R * h
  z = R * ring * sin(u)
</nano-swarm>
</body>
</html>
